name: Publish to 'publish' branch
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Push
    steps:
      - name: Checkout main
        uses: actions/checkout@v3
        with:
          ref: main
          path: clone-path
      - name: Install dependencies and run build
        working-directory: ${{ github.workspace }}/clone-path
        run: |
          pip install --upgrade pip
          pip install git+https://github.com/obsidian-html/obsidian-html
          obsidianhtml convert -i config.yaml -v
          touch output/html/.nojekyll
      - name: Publish to Github Pages
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: publish
          FOLDER: clone-path/output/html
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: "Build: ({sha}) {msg}"
